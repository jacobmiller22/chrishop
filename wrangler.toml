[env.preview]
name = "chrishop-preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "chrishop-preview-db"
database_id = "00000000-0000-0000-0000-000000000003"
migrations_dir = "migrations"

[[env.preview.kv_namespaces]]
