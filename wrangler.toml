# Cloudflare Workers Configuration for ChrisShop
name = "chrishop"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Production Custom Domain Routes
routes = [
  { pattern = "chrishop.jacobmiller22.com/*", zone_name = "jacobmiller22.com" },
  { pattern = "shop.jacobmiller22.com/*", zone_name = "jacobmiller22.com" },
  { pattern = "chrishop.com/*", zone_name = "chrishop.com" },
  { pattern = "www.chrishop.com/*", zone_name = "chrishop.com" }
]

# Production Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "chrishop-prod-db"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

# Production Workers KV Namespace Binding (Cache / ISR)
[[kv_namespaces]]
binding = "NEXT_CACHE_WORKERS_KV"
id = "00000000000000000000000000000001"

# Production Cloudflare R2 Bucket Binding (Artwork & Media)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "chrishop-media-prod"

[vars]
NODE_ENV = "production"
NEXT_PUBLIC_SITE_URL = "https://chrishop.com"
PAYLOAD_PUBLIC_SERVER_URL = "https://chrishop.com"

# Staging Environment Configuration
[env.staging]
name = "chrishop-staging"
routes = [
  { pattern = "staging.chrishop.jacobmiller22.com/*", zone_name = "jacobmiller22.com" },
  { pattern = "staging.shop.jacobmiller22.com/*", zone_name = "jacobmiller22.com" },
  { pattern = "staging.chrishop.com/*", zone_name = "chrishop.com" }
]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "chrishop-staging-db"
database_id = "00000000-0000-0000-0000-000000000002"
migrations_dir = "migrations"

[[env.staging.kv_namespaces]]
binding = "NEXT_CACHE_WORKERS_KV"
id = "00000000000000000000000000000002"

[[env.staging.r2_buckets]]
binding = "BUCKET"
bucket_name = "chrishop-media-staging"

[env.staging.vars]
NODE_ENV = "staging"
NEXT_PUBLIC_SITE_URL = "https://staging.chrishop.com"
PAYLOAD_PUBLIC_SERVER_URL = "https://staging.chrishop.com"

# Production Environment Configuration
[env.production]
name = "chrishop"
routes = [
  { pattern = "chrishop.jacobmiller22.com/*", zone_name = "jacobmiller22.com" },
  { pattern = "shop.jacobmiller22.com/*", zone_name = "jacobmiller22.com" },
  { pattern = "chrishop.com/*", zone_name = "chrishop.com" },
  { pattern = "www.chrishop.com/*", zone_name = "chrishop.com" }
]

[[env.production.d1_databases]]
binding = "DB"
database_name = "chrishop-prod-db"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[env.production.kv_namespaces]]
binding = "NEXT_CACHE_WORKERS_KV"
id = "00000000000000000000000000000001"

[[env.production.r2_buckets]]
binding = "BUCKET"
bucket_name = "chrishop-media-prod"

[env.production.vars]
NODE_ENV = "production"
NEXT_PUBLIC_SITE_URL = "https://chrishop.com"
PAYLOAD_PUBLIC_SERVER_URL = "https://chrishop.com"

