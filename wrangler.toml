# Cloudflare Workers Configuration for ChrisShop
name = "chrishop"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "enable_nodejs_fs_module", "enable_nodejs_http_modules", "enable_nodejs_http_server_modules", "enable_nodejs_os_module"]
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# Production Custom Domain Routes
routes = [
  { pattern = "chrishop.jacobmiller22.com/*", zone_name = "jacobmiller22.com" },
  { pattern = "shop.jacobmiller22.com/*", zone_name = "jacobmiller22.com" }
]

# Production Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "chrishop-prod-db"
database_id = "7e6d708d-a5c5-4ea5-b4d2-11bd637844ec"
migrations_dir = "migrations"

# Production Workers KV Namespace Binding (Cache / ISR)
[[kv_namespaces]]
binding = "NEXT_CACHE_WORKERS_KV"
id = "8e448bf8d94d4d8ea2cba989f193343d"

# Production Cloudflare R2 Bucket Binding (Artwork & Media)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "chrishop-media-prod"

# Production Feature Flags (ADR-001)
# Cloudflare Flagship Binding: Uncomment and set app_id when app is created in Cloudflare Dashboard
# [[flagship]]
# binding = "FLAGS"
# app_id = "<PRODUCTION_FLAGSHIP_APP_ID>"

[vars]
NODE_ENV = "production"
SITE_URL = "https://chrishop.jacobmiller22.com"
NEXT_PUBLIC_SITE_URL = "https://chrishop.jacobmiller22.com"
CMS_URL = "https://chrishop.jacobmiller22.com"
PAYLOAD_PUBLIC_SERVER_URL = "https://chrishop.jacobmiller22.com"
FLAG_IS_DROP_ACTIVE = "false"
FLAG_ENABLE_WIREMOCK = "false"
FLAG_MAINTENANCE_MODE = "false"
FLAG_EMERGENCY_KILL_SWITCH = "false"
FLAG_DISABLE_CHECKOUT = "false"
FLAG_VIP_EARLY_ACCESS = "false"
FLAG_VERBOSE_DEBUG_HEADERS = "false"
FLAG_PHASE_6_CANARY_PERCENT = "0"

# Staging Environment Configuration
[env.staging]
name = "chrishop-staging"
assets = { directory = ".open-next/assets", binding = "ASSETS" }
routes = [
  { pattern = "staging-chrishop.jacobmiller22.com/*", zone_name = "jacobmiller22.com" },
  { pattern = "staging-shop.jacobmiller22.com/*", zone_name = "jacobmiller22.com" }
]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "chrishop-staging-db"
database_id = "c49a7e32-455c-4e2a-9b04-163870368d82"
migrations_dir = "migrations"

[[env.staging.kv_namespaces]]
binding = "NEXT_CACHE_WORKERS_KV"
id = "0f39e4af03e344eaa160d11b047d09b6"

[[env.staging.r2_buckets]]
binding = "BUCKET"
bucket_name = "chrishop-media-staging"

# Staging Feature Flags (ADR-001)
# [[env.staging.flagship]]
# binding = "FLAGS"
# app_id = "<STAGING_FLAGSHIP_APP_ID>"

[env.staging.vars]
NODE_ENV = "staging"
SITE_URL = "https://staging-chrishop.jacobmiller22.com"
NEXT_PUBLIC_SITE_URL = "https://staging-chrishop.jacobmiller22.com"
CMS_URL = "https://staging-chrishop.jacobmiller22.com"
PAYLOAD_PUBLIC_SERVER_URL = "https://staging-chrishop.jacobmiller22.com"
FLAG_IS_DROP_ACTIVE = "true"
FLAG_ENABLE_WIREMOCK = "false"
FLAG_MAINTENANCE_MODE = "false"
FLAG_EMERGENCY_KILL_SWITCH = "false"
FLAG_DISABLE_CHECKOUT = "false"
FLAG_VIP_EARLY_ACCESS = "true"
FLAG_VERBOSE_DEBUG_HEADERS = "true"
FLAG_PHASE_6_CANARY_PERCENT = "50"

# Production Environment Configuration
[env.production]
name = "chrishop"
assets = { directory = ".open-next/assets", binding = "ASSETS" }
routes = [
  { pattern = "chrishop.jacobmiller22.com/*", zone_name = "jacobmiller22.com" },
  { pattern = "shop.jacobmiller22.com/*", zone_name = "jacobmiller22.com" }
]

[[env.production.d1_databases]]
binding = "DB"
database_name = "chrishop-prod-db"
database_id = "7e6d708d-a5c5-4ea5-b4d2-11bd637844ec"
migrations_dir = "migrations"

[[env.production.kv_namespaces]]
binding = "NEXT_CACHE_WORKERS_KV"
id = "8e448bf8d94d4d8ea2cba989f193343d"

[[env.production.r2_buckets]]
binding = "BUCKET"
bucket_name = "chrishop-media-prod"

[env.production.vars]
NODE_ENV = "production"
SITE_URL = "https://chrishop.jacobmiller22.com"
NEXT_PUBLIC_SITE_URL = "https://chrishop.jacobmiller22.com"
CMS_URL = "https://chrishop.jacobmiller22.com"
PAYLOAD_PUBLIC_SERVER_URL = "https://chrishop.jacobmiller22.com"
FLAG_IS_DROP_ACTIVE = "false"
FLAG_ENABLE_WIREMOCK = "false"
FLAG_MAINTENANCE_MODE = "false"
FLAG_EMERGENCY_KILL_SWITCH = "false"
FLAG_DISABLE_CHECKOUT = "false"
FLAG_VIP_EARLY_ACCESS = "false"
FLAG_VERBOSE_DEBUG_HEADERS = "false"
FLAG_PHASE_6_CANARY_PERCENT = "0"

# Ephemeral PR Preview Environment Configuration
[env.preview]
name = "chrishop-preview"
assets = { directory = ".open-next/assets", binding = "ASSETS" }
routes = [
  { pattern = "pr-*-chrishop.jacobmiller22.com/*", zone_name = "jacobmiller22.com" }
