# Cloudflare Workers Configuration for ChrisShop
name = "chrishop"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Production Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "chrishop-prod-db"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

# Production Workers KV Namespace Binding (Cache / ISR)
[[kv_namespaces]]
binding = "NEXT_CACHE_WORKERS_KV"
id = "00000000000000000000000000000001"

# Production Cloudflare R2 Bucket Binding (Artwork & Media)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "chrishop-media-prod"

[vars]
NODE_ENV = "production"
NEXT_PUBLIC_SITE_URL = "https://chrishop.com"
PAYLOAD_PUBLIC_SERVER_URL = "https://chrishop.com"

# Staging Environment Configuration
[env.staging]
name = "chrishop-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "chrishop-staging-db"
database_id = "00000000-0000-0000-0000-000000000002"
migrations_dir = "migrations"

[[env.staging.kv_namespaces]]
binding = "NEXT_CACHE_WORKERS_KV"
id = "00000000000000000000000000000002"

[[env.staging.r2_buckets]]
binding = "BUCKET"
bucket_name = "chrishop-media-staging"

[env.staging.vars]
NODE_ENV = "staging"
NEXT_PUBLIC_SITE_URL = "https://staging.chrishop.com"
PAYLOAD_PUBLIC_SERVER_URL = "https://staging.chrishop.com"

# Ephemeral PR Preview Environment Configuration
[env.preview]
name = "chrishop-preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "chrishop-preview-db"
database_id = "00000000-0000-0000-0000-000000000003"
migrations_dir = "migrations"

[[env.preview.kv_namespaces]]
binding = "NEXT_CACHE_WORKERS_KV"
id = "00000000-0000-0000-0000-000000000003"

[[env.preview.r2_buckets]]
binding = "BUCKET"
bucket_name = "chrishop-media-preview"

[env.preview.vars]
NODE_ENV = "preview"
NEXT_PUBLIC_SITE_URL = "https://preview.chrishop.com"
PAYLOAD_PUBLIC_SERVER_URL = "https://preview.chrishop.com"
