#cloud-config
# ==============================================================================
# ChrisShop Hetzner VPS Cloud-Init Bootstrap Configuration
# Architecture Specification: docs/deps/DEP_HETZNER.md & docs/HIGH_LEVEL_DESIGN.md
# Supported Tiers: Hetzner CX22 (Staging) / Hetzner CPX21 (Production)
# Operating System: Ubuntu 24.04 LTS (Noble Numbat, 64-bit)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. System Localization & Swap Configuration
# ------------------------------------------------------------------------------
timezone: Etc/UTC

# Allocate 2GB swap partition for memory stability on CX22 (4GB RAM)
swap:
  filename: /swapfile
  size: 2147483648  # 2 GB in bytes
  maxsize: 2147483648

# ------------------------------------------------------------------------------
# 2. Package Updates & Essential OS Tooling
# ------------------------------------------------------------------------------
package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - ufw
  - fail2ban
  - git
  - jq
  - age
  - unattended-upgrades
  - logrotate
  - awscli
  - htop
  - net-tools

# ------------------------------------------------------------------------------
# 3. Dedicated Deploy User & SSH Key Injection
# ------------------------------------------------------------------------------
users:
  - default
  - name: deploy
    gecos: ChrisShop Deploy User
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: [sudo, docker]
    shell: /bin/bash
    # Cloud-Init automatic SSH public key injection from GitHub
    ssh_import_id:
      - gh:jacobmiller22
    ssh_authorized_keys:
      # Master deployment key (fallback / offline reference)
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIChrisShopDeployKeyMasterPlaceholder2026 deploy@chrishop.com

# ------------------------------------------------------------------------------
# 4. OS Hardening & Service Configuration Files
# ------------------------------------------------------------------------------
write_files:
  # SSH Daemon Hardening: enforce public key auth, disable root login & passwords
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    permissions: '0600'
    owner: root:root
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      X11Forwarding no
      MaxAuthTries 3
      AllowUsers deploy

  # Fail2ban SSH Brute-Force Protection
  - path: /etc/fail2ban/jail.d/sshd.local
    permissions: '0644'
    owner: root:root
    content: |
      [sshd]
      enabled = true
      port = 22
      filter = sshd
      logpath = /var/log/auth.log
      maxretry = 3
      bantime = 3600
      findtime = 600

  # Docker Daemon Log Rotation & Driver Defaults
  - path: /etc/docker/daemon.json
    permissions: '0644'
    owner: root:root
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "live-restore": true,
        "userland-proxy": false
      }

  # Kernel VM Swappiness Tuning (prioritize RAM, avoid aggressive swapping)
  - path: /etc/sysctl.d/99-swappiness.conf
    permissions: '0644'
    owner: root:root
    content: |
      vm.swappiness = 10

  # Unattended Upgrades Automated Configuration
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: '0644'
    owner: root:root
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

# ------------------------------------------------------------------------------
# 5. Boot Initialization Commands (runcmd)
# ------------------------------------------------------------------------------
runcmd:
  # Apply swappiness kernel parameter immediately
  - sysctl --system

  # Install official Docker Engine repository and packages
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # Provision internal Docker bridge network for isolated database/redis services
  - docker network inspect chrishop-internal >/dev/null 2>&1 || docker network create chrishop-internal

  # Configure UFW firewall per DEP_HETZNER.md Port Matrix
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp comment 'SSH'
  - ufw allow 80/tcp comment 'HTTP / ACME'
  - ufw allow 443/tcp comment 'HTTPS'
  - ufw allow 443/udp comment 'HTTP/3 QUIC'
  - ufw --force enable

  # Add deploy user to docker group
  - usermod -aG docker deploy

  # Enable and restart hardened system services
  - systemctl restart ssh
  - systemctl enable fail2ban && systemctl restart fail2ban
  - systemctl enable docker && systemctl restart docker
