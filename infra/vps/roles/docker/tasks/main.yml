---
# ==============================================================================
# ChrisShop Ansible Role: Docker (Tasks)
# ==============================================================================

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: "{{ docker_keyring_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download official Docker GPG key
  ansible.builtin.get_url:
    url: "{{ docker_gpg_url }}"
    dest: "{{ docker_keyring_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Add official Docker apt repository source
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    owner: root
    group: root
    mode: "0644"
    content: "deb [arch={{ 'amd64' if ansible_architecture in ['x86_64', 'amd64'] else 'arm64' }} signed-by={{ docker_keyring_path }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable\n"

- name: Install Docker Engine and compose plugins
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Ensure /etc/docker configuration directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy Docker daemon configuration with log rotation presets
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: "{{ docker_daemon_config | to_nice_json }}"
  notify: Restart docker

- name: Ensure Docker service is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add deployment users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Check if internal Docker bridge network exists
  ansible.builtin.command:
    cmd: "docker network inspect {{ docker_network_name }}"
  register: docker_net_inspect
  failed_when: false
  changed_when: false

- name: Create internal Docker bridge network if absent
  ansible.builtin.command:
    cmd: "docker network create {{ docker_network_name }}"
  when: docker_net_inspect.rc != 0
