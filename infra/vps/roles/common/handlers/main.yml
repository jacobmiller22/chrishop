---
# ==============================================================================
# ChrisShop Ansible Role: Common (Handlers)
# ==============================================================================

- name: Restart ssh
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload ufw
  community.general.ufw:
    state: reloaded

- name: Apply sysctl
  ansible.builtin.command:
    cmd: sysctl --system
