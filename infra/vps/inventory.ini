# ==============================================================================
# ChrisShop Hetzner VPS Host Inventory
# Specification: docs/deps/DEP_HETZNER.md & docs/HIGH_LEVEL_DESIGN.md
# ==============================================================================

[staging]
# Staging VPS: Hetzner CX22 (2 vCPU, 4 GB RAM, 40 GB NVMe SSD, Falkenstein/fsn1)
chrishop-staging ansible_host=staging.shop.jacobmiller22.com server_tier=cx22 env=staging

[production]
# Production VPS: Hetzner CPX21 (3 vCPU AMD EPYC, 4 GB RAM, 80 GB NVMe SSD, Falkenstein/fsn1)
chrishop-prod ansible_host=shop.jacobmiller22.com server_tier=cpx21 env=production

[chrishop_servers:children]
staging
production

[chrishop_servers:vars]
ansible_user=deploy
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/chrishop_deploy_key
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
