---
# ==============================================================================
# ChrisShop Hetzner VPS Infrastructure Playbook
# Specification: docs/deps/DEP_HETZNER.md & docs/HIGH_LEVEL_DESIGN.md Section 7
#
# Usage:
#   ansible-playbook -i infra/vps/inventory.ini infra/vps/playbook.yml
#   ansible-playbook -i infra/vps/inventory.ini infra/vps/playbook.yml --syntax-check
#   ansible-playbook -i infra/vps/inventory.ini infra/vps/playbook.yml --limit staging
# ==============================================================================

- name: Bootstrap and Configure ChrisShop Hetzner VPS Hosts
  hosts: chrishop_servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify supported target operating system (Ubuntu)
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version is version("22.04", ">=")
        fail_msg: 'ChrisShop VPS automation requires Ubuntu 22.04+ (Target: Ubuntu 24.04 LTS).'
        success_msg: 'Operating system verified: {{ ansible_distribution }} {{ ansible_distribution_version }}'
      tags: [always]

  roles:
    - role: common
      tags: [common, base, security, ufw, swap]

    - role: docker
      tags: [docker, engine, containers, network]

    - role: caddy
      tags: [caddy, edge, proxy, ssl, reverse-proxy]

    - role: backup
      tags: [backup, offsite, r2, cron, disaster-recovery]
