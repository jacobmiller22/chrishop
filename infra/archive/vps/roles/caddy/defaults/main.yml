---
# ==============================================================================
# ChrisShop Ansible Role: Caddy (Defaults)
# Caddy edge reverse proxy & TLS orchestration (containerized systemd runner)
# ==============================================================================

caddy_service_name: 'caddy-runner'
caddy_container_name: 'chrishop-caddy'
caddy_image: 'caddy:2-alpine'

caddy_config_dir: '/etc/caddy'
caddy_log_dir: '/var/log/caddy'
caddy_data_dir: '/var/lib/caddy'
caddy_env_file: '/etc/caddy/caddy.env'

caddy_network: 'chrishop-internal'
caddy_admin_email: 'admin@chrishop.com'
caddy_cloudflare_api_token: ''

# Domain settings
caddy_primary_domain: 'shop.jacobmiller22.com'
caddy_staging_domain: 'staging.shop.jacobmiller22.com'
