# ==============================================================================
# fly.payload.toml — Fly.io Deployment Manifest for Payload CMS Fallback
# Architecture Decision: docs/decisions/ADR_PAYLOAD_CONTAINER_FALLBACK.md
# Reference: Story 2.44 (#190)
#
# Configures Firecracker MicroVM deployment in Fly's 'iad' (Ashburn) region
# for sub-2ms network proximity to Cloudflare D1 and R2 data centers.
# ==============================================================================

app = "chrishop-payload-fallback"
primary_region = "iad"

[build]
  dockerfile = "infra/docker/Dockerfile.payload"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  NEXT_TELEMETRY_DISABLED = "1"
  PAYLOAD_DROP_DATABASE = "false"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Maintain 1 warm instance during business hours to guarantee 0ms cold starts for editors
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    interval = "15s"
    timeout = "4s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"
    protocol = "http"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
