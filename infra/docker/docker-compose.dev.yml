services:
  postgres:
    image: postgres:16-alpine
    container_name: chrishop-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chrishop_dev}
      POSTGRES_USER: ${POSTGRES_USER:-chrishop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chrishop_dev_secret}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-chrishop} -d ${POSTGRES_DB:-chrishop_dev}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chrishop-redis
    restart: always
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: chrishop-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD-SHELL', "bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: chrishop-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      STORAGE_S3_KEY: ${STORAGE_S3_KEY:-minioadmin}
      STORAGE_S3_SECRET: ${STORAGE_S3_SECRET:-minioadmin}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-chrishop-media}
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 $${STORAGE_S3_KEY} $${STORAGE_S3_SECRET}; do
        echo 'Waiting for MinIO to be ready...';
        sleep 1;
      done;
      /usr/bin/mc mb --ignore-existing myminio/$${STORAGE_S3_BUCKET};
      /usr/bin/mc anonymous set public myminio/$${STORAGE_S3_BUCKET} || /usr/bin/mc anonymous set download myminio/$${STORAGE_S3_BUCKET};
      echo 'MinIO bucket initialized successfully';
      exit 0;
      "

  cms:
    image: directus/directus:11
    container_name: chrishop-cms
    restart: always
    ports:
      - '8055:8055'
    volumes:
      - ./../../apps/cms/extensions:/directus/extensions
    environment:
      KEY: ${KEY:-chrishop-secret-key}
      SECRET: ${SECRET:-chrishop-secret-jwt}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@chrishop.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPassword123!}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-chrishop_dev}
      DB_USER: ${POSTGRES_USER:-chrishop}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-chrishop_dev_secret}
      CACHE_ENABLED: 'true'
      CACHE_STORE: redis
      CACHE_REDIS: redis://redis:6379
      REDIS: redis://redis:6379
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8055}
      STORAGE_LOCATIONS: ${STORAGE_LOCATIONS:-s3}
      STORAGE_S3_DRIVER: ${STORAGE_S3_DRIVER:-s3}
      STORAGE_S3_KEY: ${STORAGE_S3_KEY:-minioadmin}
      STORAGE_S3_SECRET: ${STORAGE_S3_SECRET:-minioadmin}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-chrishop-media}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_FORCE_PATH_STYLE: 'true'
      STORAGE_S3_S3_FORCE_PATH_STYLE: 'true'
      STORAGE_CACHE_TTL: ${STORAGE_CACHE_TTL:-86400}
      EXTENSIONS_AUTO_RELOAD: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://127.0.0.1:8055/server/ping || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  caddy:
    build:
      context: ../caddy
      dockerfile: Dockerfile
    image: chrishop-caddy:latest
    container_name: chrishop-caddy
    restart: unless-stopped
    profiles:
      - proxy
      - caddy
    ports:
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
      - '${CADDY_HTTPS_PORT:-443}:443/udp'
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      cms:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddy_data:
  caddy_config:
