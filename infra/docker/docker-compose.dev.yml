version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chrishop-postgres
    restart: always
    environment:
      POSTGRES_DB: chrishop_dev
      POSTGRES_USER: chrishop
      POSTGRES_PASSWORD: chrishop_dev_secret
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chrishop -d chrishop_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chrishop-redis
    restart: always
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: chrishop-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  cms:
    image: directus/directus:11
    container_name: chrishop-cms
    restart: always
    ports:
      - '8055:8055'
    environment:
      KEY: chrishop-secret-key
      SECRET: chrishop-secret-jwt
      ADMIN_EMAIL: admin@chrishop.com
      ADMIN_PASSWORD: AdminPassword123!
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: chrishop_dev
      DB_USER: chrishop
      DB_PASSWORD: chrishop_dev_secret
      CACHE_ENABLED: 'true'
      CACHE_STORE: redis
      CACHE_REDIS: redis://redis:6379
      STORAGE_LOCATIONS: s3
      STORAGE_S3_DRIVER: s3
      STORAGE_S3_KEY: minioadmin
      STORAGE_S3_SECRET: minioadmin
      STORAGE_S3_BUCKET: chrishop-media
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_S3_FORCE_PATH_STYLE: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
