name: Ephemeral PR Preview Teardown

on:
  pull_request:
    types: [closed]

jobs:
  teardown-preview:
    name: Destroy Ephemeral Preview Stack
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Teardown Isolated PR Worker Stack (Unmerged PRs Only)
        if: github.event.pull_request.merged == false && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: delete --name chrishop-preview-pr-${{ github.event.pull_request.number }} --force

      - name: Log Teardown Summary
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          MERGED=${{ github.event.pull_request.merged }}
          if [ "$MERGED" = "true" ]; then
            echo "PR #${PR_NUM} was merged into staging. Ephemeral preview worker chrishop-preview-pr-${PR_NUM} is preserved for post-merge verification and link integrity."
          else
            echo "Ephemeral PR preview stack teardown completed for unmerged PR #${PR_NUM}."
          fi
