name: Ephemeral PR Preview Teardown

on:
  pull_request:
    types: [closed]

jobs:
  teardown-preview:
    name: Destroy Ephemeral Preview Stack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Teardown Isolated PR Worker Stack
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: delete --name chrishop-preview-pr-${{ github.event.pull_request.number }} --force

      - name: Setup Terraform
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: Destroy Ephemeral Terraform Preview Stack
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          cd infra/terraform/environments/preview
          terraform init -backend-config="endpoints={s3=\"https://${{ env.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}" -backend-config="key=\"environments/preview-pr-${PR_NUM}/terraform.tfstate\"" || true
          terraform destroy -auto-approve \
            -var="cloudflare_account_id=${{ env.CLOUDFLARE_ACCOUNT_ID }}" \
            -var="cloudflare_api_token=${{ env.CLOUDFLARE_API_TOKEN }}" \
            -var="pr_number=${PR_NUM}" || true

      - name: Comment Teardown Status on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const merged = context.payload.pull_request.merged;
            const previewUrl = `https://pr-${prNumber}-chrishop.jacobmiller22.com`;
            const stagingUrl = 'https://staging-chrishop.jacobmiller22.com';

            let body = '';
            if (merged) {
              body = `🧹 **Ephemeral PR Preview Decommissioned**\n\n- **PR Status**: Merged into \`staging\`\n- **Preview Environment**: \`${previewUrl}\` has been destroyed.\n- **Active Staging Environment**: [${stagingUrl}](${stagingUrl})\n\n*All isolated Cloudflare Worker, routing, and Terraform preview resources have been purged.*`;
            } else {
              body = `🧹 **Ephemeral PR Preview Decommissioned**\n\n- **PR Status**: Closed without merging\n- **Preview Environment**: \`${previewUrl}\` has been destroyed.\n\n*All isolated Cloudflare Worker, routing, and Terraform preview resources have been purged.*`;
            }

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
              });

              const botComment = comments.find(c => c.body.includes('Ephemeral PR Preview'));
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: body
                });
              }
            } catch (error) {
              console.log('Failed to update PR comment:', error.message);
            }

      - name: Log Teardown Summary
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          MERGED=${{ github.event.pull_request.merged }}
          if [ "$MERGED" = "true" ]; then
            echo "PR #${PR_NUM} was merged into staging. Ephemeral preview worker chrishop-preview-pr-${PR_NUM} and Terraform resources successfully torn down."
          else
            echo "PR #${PR_NUM} was closed without merge. Ephemeral preview stack successfully torn down."
          fi
