name: Ephemeral PR Preview Teardown

on:
  pull_request:
    types: [closed]

jobs:
  teardown-preview:
    name: Destroy Ephemeral Preview Stack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Teardown Isolated PR Worker Stack
        id: teardown_worker
        continue-on-error: true
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: delete --name chrishop-preview-pr-${{ github.event.pull_request.number }} --force

      - name: Setup Terraform
        id: setup_tf
        continue-on-error: true
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: Destroy Ephemeral Terraform Preview Stack
        id: destroy_tf
        continue-on-error: true
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          STATE_FILE="infra/terraform/environments/preview/terraform.tfstate"
          STATE_KEY="environments/preview-pr-${PR_NUM}/terraform.tfstate"

          echo "Fetching remote Terraform state from R2 for PR #${PR_NUM}..."
          pnpm exec wrangler r2 object get "chrishop-terraform-state/${STATE_KEY}" --file="${STATE_FILE}" 2>/dev/null || true

          if [ -f "${STATE_FILE}" ]; then
            echo "State file found. Destroying ephemeral resources for PR #${PR_NUM}..."
            cd infra/terraform/environments/preview
            terraform init
            terraform destroy -auto-approve \
              -var="cloudflare_account_id=${{ env.CLOUDFLARE_ACCOUNT_ID }}" \
              -var="cloudflare_api_token=${{ env.CLOUDFLARE_API_TOKEN }}" \
              -var="pr_number=${PR_NUM}"
            cd ../../..
            echo "Cleaning up remote state object from R2..."
            pnpm exec wrangler r2 object delete "chrishop-terraform-state/${STATE_KEY}" || true
          else
            echo "No Terraform state file found in R2 for PR #${PR_NUM}. Skipping Terraform destroy."
          fi

      - name: Comment Teardown Status on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const merged = context.payload.pull_request.merged;
            const previewUrl = `https://pr-${prNumber}-chrishop.jacobmiller22.com`;
            const stagingUrl = 'https://staging-chrishop.jacobmiller22.com';

            const workerOutcome = '${{ steps.teardown_worker.outcome }}';
            const tfOutcome = '${{ steps.destroy_tf.outcome }}';
            const hasErrors = workerOutcome === 'failure' || tfOutcome === 'failure';

            let body = '';
            if (hasErrors) {
              body = `⚠️ **Ephemeral PR Preview Decommission Warning**\n\n- **PR Status**: ${merged ? 'Merged into `staging`' : 'Closed without merging'}\n- **Preview Environment**: \`${previewUrl}\` teardown encountered non-fatal errors or partial cleanup.\n- **Worker Teardown**: \`${workerOutcome}\`\n- **Terraform Teardown**: \`${tfOutcome}\`\n- **Active Staging Environment**: [${stagingUrl}](${stagingUrl})\n\n*Any orphaned resources will be swept by the weekly garbage collection sweep.*`;
            } else if (merged) {
              body = `🧹 **Ephemeral PR Preview Decommissioned**\n\n- **PR Status**: Merged into \`staging\`\n- **Preview Environment**: \`${previewUrl}\` has been destroyed.\n- **Active Staging Environment**: [${stagingUrl}](${stagingUrl})\n\n*All isolated Cloudflare Worker, routing, and Terraform preview resources have been purged.*`;
            } else {
              body = `🧹 **Ephemeral PR Preview Decommissioned**\n\n- **PR Status**: Closed without merging\n- **Preview Environment**: \`${previewUrl}\` has been destroyed.\n\n*All isolated Cloudflare Worker, routing, and Terraform preview resources have been purged.*`;
            }

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
              });

              const botComment = comments.find(c => c.body.includes('Ephemeral PR Preview'));
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: body
                });
              }
            } catch (error) {
              console.log('Failed to update PR comment:', error.message);
            }

      - name: Log Teardown Summary
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          MERGED=${{ github.event.pull_request.merged }}
          WORKER_OUTCOME="${{ steps.teardown_worker.outcome }}"
          TF_OUTCOME="${{ steps.destroy_tf.outcome }}"
          echo "Teardown Summary for PR #${PR_NUM} (merged=${MERGED}):"
          echo "  - Worker Teardown: ${WORKER_OUTCOME}"
          echo "  - Terraform Teardown: ${TF_OUTCOME}"
          if [ "$WORKER_OUTCOME" = "failure" ] || [ "$TF_OUTCOME" = "failure" ]; then
            echo "⚠️ Non-fatal teardown warning recorded. Orphaned resources will be caught by preview-cleanup sweep."
          else
            echo "✅ Ephemeral preview stack successfully torn down."
          fi
