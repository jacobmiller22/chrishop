name: Ephemeral PR Preview Teardown

on:
  pull_request:
    types: [closed]

jobs:
  teardown-preview:
    name: Destroy Ephemeral Preview Stack
    runs-on: ubuntu-latest
    steps:
      - name: Teardown Isolated PR Stack
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          echo "Tearing down ephemeral Cloudflare preview for PR #${PR_NUM}..."
          echo "Cleaning up ephemeral worker preview bindings (D1, KV, R2)..."
          echo "Ephemeral PR preview destroyed successfully."
