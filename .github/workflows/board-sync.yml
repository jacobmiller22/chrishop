name: Auto Board Sync

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, ready_for_review, closed]

jobs:
  update-board-status:
    name: Sync Project Board Card Status
    runs-on: ubuntu-latest
    steps:
      - name: Board Card Status Transition
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const eventName = context.eventName;
            const action = context.payload.action;
            
            if (eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              if (action === 'opened' || action === 'ready_for_review') {
                console.log(`PR #${pr.number} opened/ready. Transitioning linked issue card status to 'In Review'.`);
              } else if (action === 'closed' && pr.merged) {
                console.log(`PR #${pr.number} merged into ${pr.base.ref}. Transitioning linked issue card status to 'Done'.`);
              }
            } else if (eventName === 'issues' && action === 'opened') {
              console.log(`New issue #${context.payload.issue.number} logged. Adding card to 'Backlog'.`);
            }
