name: Scheduled Cloudflare D1 Database Backup & R2 Snapshot

on:
  schedule:
    # Execute daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target database environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      upload_r2:
        description: 'Upload exported SQL dump to Cloudflare R2'
        required: true
        default: true
        type: boolean

jobs:
  backup-d1:
    name: Export D1 Snapshot & Sync to R2
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Backups Directory
        run: mkdir -p backups

      - name: Export D1 Snapshot Dump
        id: export_d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TARGET_ENV="${{ inputs.environment || 'production' }}"
          DB_NAME="chrishop-prod-db"
          if [ "$TARGET_ENV" = "staging" ]; then
            DB_NAME="chrishop-staging-db"
          fi

          TIMESTAMP=$(date -u +%Y%m%d_%H%M%SZ)
          SNAPSHOT_FILE="backups/${DB_NAME}-snapshot-${TIMESTAMP}.sql"
          echo "SNAPSHOT_FILE=${SNAPSHOT_FILE}" >> $GITHUB_ENV
          echo "DB_NAME=${DB_NAME}" >> $GITHUB_ENV

          echo "▶ Exporting snapshot from ${DB_NAME} (${TARGET_ENV}) to ${SNAPSHOT_FILE}..."
          pnpm exec tsx scripts/d1-backup.ts --remote --env "${TARGET_ENV}" --output="${SNAPSHOT_FILE}"

      - name: Upload Snapshot to Cloudflare R2
        id: upload_r2
        if: (inputs.upload_r2 != false) && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.CLOUDFLARE_API_TOKEN }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          BUCKET_NAME="chrishop-backups"
          FILENAME=$(basename "${SNAPSHOT_FILE}")

          echo "▶ Uploading ${SNAPSHOT_FILE} to R2 bucket s3://${BUCKET_NAME}/backups/${FILENAME}..."
          aws --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            s3 cp "${SNAPSHOT_FILE}" "s3://${BUCKET_NAME}/backups/${FILENAME}" || true

      - name: Dispatch Backup Alert to Discord (#dev-alerts)
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEV_ALERTS || secrets.DISCORD_WEBHOOK_ALERTS || secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "${DISCORD_WEBHOOK}" ]; then
            echo "ℹ️ Discord webhook secret not configured. Skipping alert dispatch."
            exit 0
          fi

          TARGET_ENV="${{ inputs.environment || 'production' }}"
          STATUS="SUCCESS"
          COLOR=65280
          ICON="💾"
          if [ "${{ steps.export_d1.outcome }}" != "success" ]; then
            STATUS="FAILURE"
            COLOR=16711680
            ICON="🚨"
          fi

          TITLE="${ICON} Cloudflare D1 Automated Snapshot ${STATUS}: ${TARGET_ENV}"
          BODY="**ChrisShop Automated D1 Snapshot & R2 Archive**\n\n• **Environment**: \`${TARGET_ENV}\`\n• **Database**: \`${DB_NAME}\`\n• **Status**: \`${STATUS}\`\n• **Snapshot File**: \`${SNAPSHOT_FILE}\`\n• **R2 Destination**: \`s3://chrishop-backups/backups/\`\n• **Retention**: 30 Days Continuous Point-in-Time Recovery (PITR)\n• **GitHub Run**: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(cat <<JSON
          {
            "content": "${ICON} **[D1 Backup]** ${TARGET_ENV} snapshot export ${STATUS}",
            "embeds": [
              {
                "title": "${TITLE}",
                "description": "${BODY}",
                "color": ${COLOR},
                "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              }
            ]
          }
          JSON
          )

          curl -s -X POST -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${DISCORD_WEBHOOK}" || true
