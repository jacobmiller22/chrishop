name: CI

on:
  push:
    branches: [main, staging, production]
  pull_request:
    branches: [main, staging, production]

jobs:
  enforce-promotion-rules:
    name: Enforce Staged Promotion Rules
    runs-on: ubuntu-latest
    steps:
      - name: Validate Staged Git Promotion Governance
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Target branch (base): ${{ github.base_ref }}"
            echo "Source branch (head): ${{ github.head_ref }}"
            if [ "${{ github.base_ref }}" = "production" ] && [ "${{ github.head_ref }}" != "staging" ]; then
              echo "❌ ERROR: Direct pull requests to 'production' are prohibited."
              echo "Only the 'staging' branch is permitted to merge into 'production'."
              echo "Attempted merge from: '${{ github.head_ref }}'"
              echo "Please retarget your pull request to 'staging' or promote changes via 'staging'."
              exit 1
            fi
            echo "✅ Promotion rule check passed (Base: ${{ github.base_ref }}, Head: ${{ github.head_ref }})."
          else
            echo "Push event on ref: ${{ github.ref }}. Promotion check satisfied."
          fi

  lint-and-check:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    needs: [enforce-promotion-rules]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency Security Audit
        run: pnpm audit --audit-level=high

      - name: GitHub Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high

      - name: Monorepo Typecheck & Lint
        run: pnpm run check

      - name: Run Unit Tests
        run: pnpm run test:unit

      - name: Run Local In-Memory Integration Tests
        run: pnpm run test:integration

      - name: Build Monorepo Workspaces
        run: pnpm run build

      - name: Check Worker Bundle Size Budget Gate
        run: pnpm run check:bundle

      - name: Validate Cloudflare Worker Deployment (Dry-Run)
        if: github.event_name == 'pull_request'
        run: pnpm wrangler deploy --dry-run --env preview

  playwright-ui:
    name: Playwright UI & Integration Suite
    runs-on: ubuntu-latest
    needs: [lint-and-check]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright Browser Binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers & System Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Install OS Dependencies (Cache Hit Fallback)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit

      - name: Run Playwright UI Tests
        run: pnpm run test:ui --project=desktop-chromium --project=mobile-safari-iphone-14

      - name: Upload Playwright Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-report
          path: playwright-report/
          retention-days: 14
