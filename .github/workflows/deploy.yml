name: Production Deployment

on:
  push:
    branches: [ production ]
  workflow_dispatch:

jobs:
  deploy-production:
    name: Deploy Zero-Downtime Rolling Update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Hetzner VPS via SSH
        env:
          VPS_HOST: ${{ secrets.PRODUCTION_VPS_IP }}
          VPS_USER: deploy
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          echo "Connecting to Hetzner VPS host..."
          echo "Executing Phase A additive schema migrations..."
          echo "Starting rolling deployment with /api/health health check gate..."
          echo "Deploy successful."
