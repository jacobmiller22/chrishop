name: Cloudflare Workers CI/CD Deployment

on:
  push:
    branches:
      - staging
      - production
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-validate:
    name: Build & Validate Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency Security Audit
        run: pnpm audit --audit-level=high

      - name: Typecheck & Lint
        run: pnpm run check

      - name: Run Unit Test Suite
        run: pnpm run test:unit

      - name: Build Application
        run: pnpm run build

  deploy-staging:
    name: Deploy to Staging Edge
    runs-on: ubuntu-latest
    needs: [build-and-validate]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Application
        run: pnpm run build

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.1"

      - name: Apply Staging Infrastructure via Terraform
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          cd infra/terraform/environments/staging
          terraform init -backend-config="endpoints={s3=\"https://${{ env.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}" || true
          terraform apply -auto-approve \
            -var="cloudflare_account_id=${{ env.CLOUDFLARE_ACCOUNT_ID }}" \
            -var="cloudflare_api_token=${{ env.CLOUDFLARE_API_TOKEN }}" || true

      - name: Apply D1 Migrations & Seed Staging Database
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          echo "Applying D1 migrations to chrishop-staging-db..."
          pnpm exec wrangler d1 migrations apply chrishop-staging-db --remote --env staging || true
          echo "Exporting BankBeaters seed SQL..."
          pnpm exec tsx scripts/seed-db.ts --export-sql scripts/seed.sql
          echo "Executing seed script against chrishop-staging-db..."
          pnpm exec wrangler d1 execute chrishop-staging-db --remote --env staging --file=scripts/seed.sql || true

      - name: Provision Staging Cloudflare Queues
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          pnpm exec wrangler queues create shopify-orders-queue-staging 2>/dev/null || true
          pnpm exec wrangler queues create shopify-orders-dlq-staging 2>/dev/null || true
          if ! pnpm exec wrangler queues list 2>/dev/null | grep -q "shopify-orders-queue-staging"; then
            echo "Queue shopify-orders-queue-staging not found on Cloudflare account. Omitting queues binding for staging."
            node -e '
              const fs = require("fs");
              let content = fs.readFileSync("wrangler.toml", "utf-8");
              content = content.replace(/\[\[env\.staging\.queues\.producers\]\][\s\S]*?dead_letter_queue\s*=\s*"shopify-orders-dlq-staging"/, "# Queues omitted (unprovisioned in staging)");
              fs.writeFileSync("wrangler.toml", content);
            '
          fi

      - name: Deploy to Cloudflare Workers (Staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging
  test-staging:
    name: Verify Staging Integration & Edge Parity
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Pre-Test Staging Edge Commit Hash Assertion
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          STAGING_URL="https://staging-chrishop.jacobmiller22.com"
          EXPECTED_SHA="${{ github.sha }}"
          echo "Verifying staging edge commit hash matches candidate commit ${EXPECTED_SHA} before integration tests..."
          MAX_ATTEMPTS=12
          ATTEMPT=0
          MATCHED=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Staging hash verification attempt $ATTEMPT of $MAX_ATTEMPTS..."
            RES_DATA=$(curl -s -f -H "cache-control: no-store" "${STAGING_URL}/api/health" || true)
            EDGE_SHA=$(echo "$RES_DATA" | jq -r '.commitSha // empty' 2>/dev/null || true)
            if [ -z "$EDGE_SHA" ]; then
              EDGE_SHA=$(curl -s -I -H "cache-control: no-store" "${STAGING_URL}/api/health" | grep -i "x-chrishop-commit-sha" | awk -F': ' '{print $2}' | tr -d '\r\n' || true)
            fi

            echo "Staging Edge Live SHA: ${EDGE_SHA:-unknown} (Expected: ${EXPECTED_SHA})"
            if [ -n "$EDGE_SHA" ] && ([ "$EDGE_SHA" = "$EXPECTED_SHA" ] || [ "${EDGE_SHA:0:7}" = "${EXPECTED_SHA:0:7}" ]); then
              echo "✅ Pre-test staging commit hash assertion passed: ${EDGE_SHA}"
              MATCHED=1
              break
            fi

            echo "Waiting 5 seconds for edge propagation..."
            sleep 5
          done

          if [ $MATCHED -ne 1 ]; then
            echo "❌ Staging edge SHA did not match candidate commit ${EXPECTED_SHA}. Aborting deployment."
            exit 1
          fi

      - name: Staging Environment Parity Loop
        run: |
          STAGING_URL="https://staging-chrishop.jacobmiller22.com"
          echo "Verifying staging edge parity and /api/health probe at ${STAGING_URL}..."
          MAX_ATTEMPTS=12
          ATTEMPT=0
          SUCCESS=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Staging parity probe attempt $ATTEMPT of $MAX_ATTEMPTS..."

            if pnpm run test:parity --target staging --url "${STAGING_URL}"; then
              echo "✅ Staging environment parity and /api/health verified!"
              SUCCESS=1
              break
            fi

            echo "Parity probe returned failure. Retrying in 5 seconds..."
            sleep 5
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "❌ Staging environment parity verification failed after $MAX_ATTEMPTS attempts."
            exit 1
          fi

      - name: Post-Test Staging SHA Integrity Check
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          STAGING_URL="https://staging-chrishop.jacobmiller22.com"
          EXPECTED_SHA="${{ github.sha }}"
          echo "Re-verifying staging edge commit hash post-test to detect interleaving mutations..."
          RES_DATA=$(curl -s -f -H "cache-control: no-store" "${STAGING_URL}/api/health" || true)
          POST_SHA=$(echo "$RES_DATA" | jq -r '.commitSha // empty' 2>/dev/null || true)
          if [ -z "$POST_SHA" ]; then
            POST_SHA=$(curl -s -I -H "cache-control: no-store" "${STAGING_URL}/api/health" | grep -i "x-chrishop-commit-sha" | awk -F': ' '{print $2}' | tr -d '\r\n' || true)
          fi

          echo "Post-Test Staging Edge Live SHA: ${POST_SHA:-unknown}"
          if [ -n "$POST_SHA" ] && [ "$POST_SHA" != "$EXPECTED_SHA" ] && [ "${POST_SHA:0:7}" != "${EXPECTED_SHA:0:7}" ]; then
            echo "🚨 Mid-test staging mutation detected! Edge SHA changed from ${EXPECTED_SHA} to ${POST_SHA} during test execution. Failing promotion."
            exit 1
          fi
          echo "✅ Staging SHA integrity confirmed post-test (no race condition detected)."

  deploy-production:
    name: Deploy to Production Edge (Gated)
    runs-on: ubuntu-latest
    needs: [build-and-validate, deploy-staging, test-staging]
    if: github.ref == 'refs/heads/production' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Pre-Approval Production Target Commit Validation
        run: |
          EXPECTED_SHA="${{ github.sha }}"
          echo "Verifying deployment artifact commit SHA matches release target commit ${EXPECTED_SHA}..."
          CURRENT_HEAD=$(git rev-parse HEAD)
          if [ "$CURRENT_HEAD" != "$EXPECTED_SHA" ]; then
            echo "❌ Current checkout HEAD (${CURRENT_HEAD}) does not match trigger SHA (${EXPECTED_SHA})."
            exit 1
          fi
          echo "✅ Release candidate SHA ${EXPECTED_SHA} validated."

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Application
        run: pnpm run build

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.1"

      - name: Apply Production Infrastructure via Terraform
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          cd infra/terraform/environments/production
          terraform init -backend-config="endpoints={s3=\"https://${{ env.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}" || true
          terraform apply -auto-approve \
            -var="cloudflare_account_id=${{ env.CLOUDFLARE_ACCOUNT_ID }}" \
            -var="cloudflare_api_token=${{ env.CLOUDFLARE_API_TOKEN }}" || true

      - name: Apply D1 Migrations to Production Database
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          echo "Applying D1 migrations to chrishop-prod-db..."
          pnpm exec wrangler d1 migrations apply chrishop-prod-db --remote || true

      - name: Provision Production Cloudflare Queues
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          pnpm exec wrangler queues create shopify-orders-queue 2>/dev/null || true
          pnpm exec wrangler queues create shopify-orders-dlq 2>/dev/null || true
          if ! pnpm exec wrangler queues list 2>/dev/null | grep -q "shopify-orders-queue"; then
            echo "Queue shopify-orders-queue not found on Cloudflare account. Omitting queues binding for production."
            node -e '
              const fs = require("fs");
              let content = fs.readFileSync("wrangler.toml", "utf-8");
              content = content.replace(/\[\[env\.production\.queues\.producers\]\][\s\S]*?dead_letter_queue\s*=\s*"shopify-orders-dlq"/, "# Queues omitted (unprovisioned in production)");
              content = content.replace(/\[\[queues\.producers\]\][\s\S]*?dead_letter_queue\s*=\s*"shopify-orders-dlq"/, "# Queues omitted (unprovisioned in production)");
              fs.writeFileSync("wrangler.toml", content);
            '
          fi

      - name: Deploy to Cloudflare Workers (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production
  verify-production:
    name: Verify Production Edge Health
    runs-on: ubuntu-latest
    needs: [deploy-production]

    steps:
      - name: Production Edge Health Probe Loop
        run: |
          PROD_URL="https://chrishop.jacobmiller22.com"
          echo "Probing production edge health at ${PROD_URL}/api/health..."

          MAX_ATTEMPTS=12
          ATTEMPT=0
          SUCCESS=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Production health probe attempt $ATTEMPT of $MAX_ATTEMPTS..."

            HTTP_STATUS=$(curl -s -o /tmp/prod_res.json -w "%{http_code}" --max-time 5 "${PROD_URL}/api/health" || true)

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Production edge health probe succeeded with HTTP 200!"
              cat /tmp/prod_res.json
              SUCCESS=1
              break
            fi

            echo "Probe returned HTTP status: ${HTTP_STATUS}. Retrying in 5 seconds..."
            sleep 5
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "❌ Production edge health probe failed after $MAX_ATTEMPTS attempts."
            exit 1
          fi

  notify-deployment:
    name: Dispatch Deployment Alert to Discord
    runs-on: ubuntu-latest
    needs: [build-and-validate, deploy-staging, test-staging, deploy-production, verify-production]
    if: always()
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEV_ALERTS || secrets.DISCORD_WEBHOOK_ALERTS || secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Dispatch Discord Deployment Notification
        if: env.DISCORD_WEBHOOK != ''
        run: |
          TARGET_ENV="staging"
          if [ "${{ github.ref }}" = "refs/heads/production" ] || [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.event.inputs.environment }}" = "production" ]; then
            TARGET_ENV="production"
          fi

          IS_SUCCESS=true
          if [ "$TARGET_ENV" = "production" ]; then
            if [ "${{ needs.deploy-production.result }}" != "success" ] || [ "${{ needs.verify-production.result }}" != "success" ]; then
              IS_SUCCESS=false
            fi
          else
            if [ "${{ needs.build-and-validate.result }}" != "success" ] || [ "${{ needs.deploy-staging.result }}" != "success" ] || [ "${{ needs.test-staging.result }}" != "success" ]; then
              IS_SUCCESS=false
            fi
          fi

          STATUS="SUCCESS"
          COLOR=65280
          ICON="🚀"
          if [ "$IS_SUCCESS" != "true" ]; then
            STATUS="FAILURE"
            COLOR=16711680
            ICON="🚨"
          fi

          TITLE="${ICON} ChrisShop CD Deployment ${STATUS}: ${TARGET_ENV}"
          PROD_URL="https://chrishop.jacobmiller22.com"
          STAGING_URL="https://staging-chrishop.jacobmiller22.com"
          TARGET_URL="${PROD_URL}"
          if [ "$TARGET_ENV" = "staging" ]; then
            TARGET_URL="${STAGING_URL}"
          fi

          BODY="**ChrisShop Edge Continuous Deployment**\n\n• **Environment**: \`${TARGET_ENV}\`\n• **Status**: \`${STATUS}\`\n• **Ref**: \`${{ github.ref_name }}\` (\`${{ github.sha }}\`)\n• **Triggered by**: @${{ github.actor }}\n• **Edge Target**: ${TARGET_URL}\n• **Health Probe**: ${TARGET_URL}/api/health\n• **GitHub Run**: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(cat <<JSON
          {
            "content": "${ICON} **[CD Deployment]** ${TARGET_ENV} deployment ${STATUS}",
            "embeds": [
              {
                "title": "${TITLE}",
                "description": "${BODY}",
                "color": ${COLOR},
                "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              }
            ]
          }
          JSON
          )

          curl -s -X POST -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${DISCORD_WEBHOOK}" || true
