name: Ephemeral PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy-preview:
    name: Build & Spin Up Ephemeral Preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute Preview Variables
        id: vars
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          echo "PR_NUM=${PR_NUM}" >> $GITHUB_ENV
          echo "PREVIEW_URL=https://pr-${PR_NUM}.preview.chrishop.com" >> $GITHUB_ENV

      - name: Build Preview Docker Images
        run: |
          echo "Building preview container images: web:pr-${PR_NUM}, cms:pr-${PR_NUM}"

      - name: Comment Preview Link on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = process.env.PREVIEW_URL;
            const body = `🚀 **Ephemeral PR Preview Deployed!**\n\nPreview Environment: [${previewUrl}](${previewUrl})\nDirectus Admin UI: [${previewUrl}/admin](${previewUrl}/admin)\n\n*This environment will automatically tear down when the PR is closed.*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c => c.body.includes('Ephemeral PR Preview Deployed!'));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }
