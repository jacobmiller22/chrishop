name: Ephemeral PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy-preview:
    name: Build & Validate Ephemeral Cloudflare Preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & Lint
        run: pnpm run check

      - name: Run Unit Tests
        run: pnpm run test:unit

      - name: Build Application
        run: pnpm run build

      - name: Run Local In-Memory Integration Tests
        run: pnpm run test:integration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Preview Variables
        id: vars
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          echo "PR_NUM=${PR_NUM}" >> $GITHUB_ENV
          echo "PREVIEW_URL=https://pr-${PR_NUM}-chrishop.jacobmiller22.com" >> $GITHUB_ENV

          # Configure dynamic worker name and route in wrangler.toml for isolated per-PR deployment
          sed -i -e "s/name = \"chrishop-preview\"/name = \"chrishop-preview-pr-${PR_NUM}\"/g" wrangler.toml
          sed -i -e "s/pr-\*-chrishop/pr-${PR_NUM}-chrishop/g" wrangler.toml

          # If R2 bucket does not exist or R2 is disabled, gracefully omit r2_buckets binding for preview
          if ! pnpm exec wrangler r2 bucket list 2>/dev/null | grep -q "chrishop-media-preview"; then
            echo "R2 bucket chrishop-media-preview not provisioned on Cloudflare account. Omitting R2 binding for preview."
            node -e '
              const fs = require("fs");
              let content = fs.readFileSync("wrangler.toml", "utf-8");
              content = content.replace(/\[\[env\.preview\.r2_buckets\]\][\s\S]*?bucket_name\s*=\s*"chrishop-media-preview"/, "# R2 omitted (unprovisioned)");
              fs.writeFileSync("wrangler.toml", content);
            '
          fi

          # Provision or gracefully omit preview queues if unprovisioned on Cloudflare account
          pnpm exec wrangler queues create shopify-orders-queue-preview 2>/dev/null || true
          pnpm exec wrangler queues create shopify-orders-dlq-preview 2>/dev/null || true
          if ! pnpm exec wrangler queues list 2>/dev/null | grep -q "shopify-orders-queue-preview"; then
            echo "Queue shopify-orders-queue-preview not found on Cloudflare account. Omitting queues binding for preview."
            node -e '
              const fs = require("fs");
              let content = fs.readFileSync("wrangler.toml", "utf-8");
              content = content.replace(/\[\[env\.preview\.queues\.producers\]\][\s\S]*?dead_letter_queue\s*=\s*"shopify-orders-dlq-preview"/, "# Queues omitted (unprovisioned in preview)");
              fs.writeFileSync("wrangler.toml", content);
            '
          fi

      - name: Setup Terraform
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: Provision Ephemeral Preview Infrastructure via Terraform
        id: provision_tf
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          STATE_FILE="infra/terraform/environments/preview/terraform.tfstate"
          STATE_KEY="environments/preview-pr-${PR_NUM}/terraform.tfstate"

          # Restore existing remote state from R2 if updating an active PR preview
          pnpm exec wrangler r2 object get "chrishop-terraform-state/${STATE_KEY}" --file="${STATE_FILE}" 2>/dev/null || true

          cd infra/terraform/environments/preview
          terraform init
          terraform apply -auto-approve \
            -var="cloudflare_account_id=${{ env.CLOUDFLARE_ACCOUNT_ID }}" \
            -var="cloudflare_api_token=${{ env.CLOUDFLARE_API_TOKEN }}" \
            -var="pr_number=${PR_NUM}"

          # Export outputs to bridge script
          terraform output -json > /tmp/tf-preview-output.json
          cd ../../..

          # Persist updated state back to R2 state bucket
          pnpm exec wrangler r2 object put "chrishop-terraform-state/${STATE_KEY}" --file="${STATE_FILE}" || true

          # Inject ephemeral D1 and KV IDs into wrangler.toml
          pnpm exec tsx scripts/generate-wrangler-config.ts --env preview --from-tf-output /tmp/tf-preview-output.json

      - name: Initialize, Migrate & Seed Preview D1 Database
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          PR_DB_NAME="chrishop-preview-pr-${PR_NUM}-db"
          echo "Applying D1 migrations to ${PR_DB_NAME}..."
          pnpm exec wrangler d1 migrations apply "${PR_DB_NAME}" --remote --env preview || true
          echo "Exporting BankBeaters seed SQL..."
          pnpm exec tsx scripts/seed-db.ts --export-sql scripts/seed.sql
          echo "Executing BankBeaters seed script against ${PR_DB_NAME}..."
          pnpm exec wrangler d1 execute "${PR_DB_NAME}" --remote --file=scripts/seed.sql || true

      - name: Deploy Ephemeral Preview to Cloudflare Workers
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env preview


      - name: Verify Edge Health Probe
        id: verify_edge
        if: steps.deploy.outcome == 'success'
        run: |
          echo "Verifying edge health probe at ${PREVIEW_URL}/api/health..."
          MAX_ATTEMPTS=12
          ATTEMPT=0
          SUCCESS=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Health probe attempt $ATTEMPT of $MAX_ATTEMPTS..."
            if HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "${PREVIEW_URL}/api/health") && [ "$HTTP_STATUS" = "200" ]; then
              echo "Edge health probe passed (HTTP 200)!"
              SUCCESS=1
              break
            fi
            sleep 5
          done
          if [ $SUCCESS -ne 1 ]; then
            echo "Edge health probe failed to reach ${PREVIEW_URL}/api/health after $MAX_ATTEMPTS attempts."
            exit 1
          fi

      - name: Comment Preview Status on PR
        if: always() && steps.vars.outcome == 'success'
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_edge.outcome }}
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = process.env.PREVIEW_URL;
            const deployOutcome = process.env.DEPLOY_OUTCOME;
            const verifyOutcome = process.env.VERIFY_OUTCOME;

            let body = '';
            if (deployOutcome === 'success' && verifyOutcome === 'success') {
              body = `🚀 **Ephemeral PR Preview Ready & Verified!**\n\n- **Preview Environment**: [${previewUrl}](${previewUrl})\n- **Edge Health Probe**: Verified (\`/api/health\` returned HTTP 200)\n- **Architecture**: Cloudflare Workers + D1 SQLite + Workers KV + R2\n- **Local In-Memory Integration Tests**: Passed\n\n*This environment will automatically tear down when the PR is merged or closed.*`;
            } else if (deployOutcome === 'skipped') {
              body = `⚠️ **Ephemeral PR Preview Skipped**\n\n- **Reason**: Cloudflare credentials (\`CLOUDFLARE_API_TOKEN\`, \`CLOUDFLARE_ACCOUNT_ID\`) are not configured in repository secrets.\n- **Local Verification**: Passed (typecheck, lint, unit tests, in-memory integration tests, build)\n- **Preview Environment**: Skipped deployment to edge\n\n*Configure Cloudflare repository secrets to enable automated preview environments on pull requests.*`;
            } else {
              body = `❌ **Ephemeral PR Preview Deployment Failed**\n\n- **Preview Environment**: [${previewUrl}](${previewUrl})\n- **Status**: Deployment or edge health verification failed.\n\n*Please inspect the GitHub Actions run logs for detailed diagnostic output.*`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c => c.body.includes('Ephemeral PR Preview'));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }

      - name: Fail Job on Deploy or Verification Failure
        if: steps.deploy.outcome == 'failure' || steps.verify_edge.outcome == 'failure'
        run: |
          echo "Ephemeral preview deploy or edge verification probe failed."
          exit 1
